<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub · Project</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23256a8f'/%3E%3Cpath d='M9 22V10m14 12V10M9 16h14' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="helpers.css">
<link rel="stylesheet" href="md.css">
<link rel="stylesheet" href="chatview.css">
<link rel="stylesheet" href="project.css">
<script src="theme.js"></script>
</head>
<body class="pbody">
<a class="skip" href="#project-main">Skip to the chat</a>
<header class="top pt">
  <div class="pt-inner">
    <a class="pt-hub" href="/" aria-label="Back to the Hub dashboard">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Hub</a>
    <h1 class="pt-name" id="pt-name">Project</h1>
    <span class="pt-phase" id="pt-phase"></span>
    <div class="pt-prog" id="pt-prog"><div class="bar" id="pt-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><b class="pt-pct" id="pt-pct"></b></div>
    <button class="pt-chip" id="pt-decs" type="button" aria-haspopup="dialog" hidden><span class="pt-diamond" aria-hidden="true"></span><span class="pt-chip-text"></span></button>
    <span class="pt-fill"></span>
    <span class="tag" id="demo-tag" hidden>Sample data</span>
    <button class="cv-ibtn pt-more" id="pt-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Project menu" title="Project menu">
      <svg class="ic ic-more" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01"/></svg>
      <span class="pt-dot" id="pt-dot" hidden></span>
    </button>
    <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <p class="sr" id="summary" aria-live="polite">Loading the project…</p>
</header>

<div class="banner" id="banner" role="status" hidden>Can't reach the Hub server. Showing the last data it sent.</div>

<main class="pmain" id="project-main">
  <div id="page"></div>
</main>
<p class="note" id="note" role="status" aria-live="polite" hidden></p>
<script src="project.js" type="module"></script>
</body>
</html>
