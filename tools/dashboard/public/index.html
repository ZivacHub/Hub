<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23256a8f'/%3E%3Cpath d='M9 22V10m14 12V10M9 16h14' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<a class="skip" href="#projects">Skip to projects</a>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">Hub</h1>
    <p class="summary" id="summary" aria-live="polite">Loading your projects…</p>
    <div class="top-tools">
      <span class="tag" id="demo-tag" hidden>Sample data</span>
      <span class="updated" id="updated"></span>
      <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="banner" id="banner" role="status" hidden>Can't reach the Hub server. Showing the last data it sent.</div>

<main class="layout">
  <aside class="side" aria-label="Waiting on you and the Manager">
    <section class="panel" aria-labelledby="h-wait">
      <h2 id="h-wait">Waiting on you <span class="count" id="wait-count"></span></h2>
      <ul class="waitlist" id="waitlist"></ul>
    </section>
    <section class="panel" aria-labelledby="h-mgr">
      <h2 id="h-mgr">AI_Orcestration Manager</h2>
      <div id="manager"></div>
    </section>
  </aside>

  <div class="content" id="projects">
    <section aria-labelledby="h-active">
      <h2 id="h-active">In progress <span class="count" id="active-count"></span></h2>
      <div class="grid" id="active"></div>
    </section>
    <section aria-labelledby="h-done" id="done-section" hidden>
      <h2 id="h-done">Finished <span class="count" id="done-count"></span></h2>
      <div class="grid" id="done"></div>
    </section>
    <section aria-labelledby="h-unset" id="unset-section" hidden>
      <h2 id="h-unset">Not set up <span class="count" id="unset-count"></span></h2>
      <ul class="chips" id="unset"></ul>
    </section>
  </div>
</main>
<p class="note" id="note" role="status" aria-live="polite" hidden></p>
<script src="app.js" type="module"></script>
</body>
</html>
